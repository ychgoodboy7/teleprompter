<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公牛开关插座 抖音直播提词器</title>
<style>
  :root {
    --bg: #111214;
    --panel: #1a1c20;
    --panel-2: #21242a;
    --text: #f2f3f5;
    --dim: #9aa0a6;
    --accent: #ffd450;
    --accent-soft: rgba(255, 212, 80, 0.14);
    --line: rgba(255, 255, 255, 0.25);
    --fs: 34px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex;
    background: var(--bg);
    color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  /* ---------- 左侧章节跳转栏 ---------- */
  #sidebar {
    width: 210px;
    flex: 0 0 210px;
    background: var(--panel);
    border-right: 1px solid #26292f;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 14px 10px 20px;
  }
  #sidebar .brand {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    padding: 6px 10px 14px;
    border-bottom: 1px solid #26292f;
    margin-bottom: 10px;
    letter-spacing: 1px;
  }
  #sidebar .brand small { display: block; font-size: 12px; color: var(--dim); font-weight: 400; margin-top: 3px; letter-spacing: 0; }
  #sidebar button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    color: var(--dim);
    font-size: 15px;
    padding: 9px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    margin-bottom: 2px;
    transition: background .15s, color .15s;
  }
  #sidebar button:hover { background: var(--panel-2); color: var(--text); }
  #sidebar button.active { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  #sidebar button .num {
    display: inline-block;
    width: 22px;
    color: var(--dim);
    font-size: 12px;
    opacity: .7;
  }
  #sidebar button.active .num { color: var(--accent); }

  /* ---------- 右侧主体 ---------- */
  #right {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  #prompter {
    position: relative;
    flex: 1;
    overflow: hidden;
    background:
      radial-gradient(120% 90% at 50% 0%, #171a1f 0%, var(--bg) 60%);
  }
  #content {
    height: 100%;
    overflow: hidden;
    padding: 6vh 7vw 60vh;
    font-size: var(--fs);
    line-height: 1.85;
  }
  #content .block {
    position: relative;
    padding: 10px 22px;
    border-left: 5px solid transparent;
    border-radius: 4px;
    margin-bottom: 4px;
    transition: background .18s, border-color .18s;
  }
  #content .block.active {
    background: var(--accent-soft);
    border-left-color: var(--accent);
  }
  #content .block.h {
    font-size: calc(var(--fs) * 1.15);
    font-weight: 800;
    color: var(--accent);
    border-left-color: transparent;
    padding-top: 34px;
    padding-bottom: 8px;
    letter-spacing: 1px;
  }
  #content .block.h:first-child { padding-top: 10px; }
  #content .block.note {
    font-size: calc(var(--fs) * 0.62);
    color: var(--dim);
    border-left-color: #3a3f47;
    background: rgba(255,255,255,0.025);
    line-height: 1.6;
  }
  #content .block.bullet { padding-left: 40px; }
  #content .block.bullet::before {
    content: "▸";
    position: absolute;
    left: 16px;
    color: var(--accent);
    opacity: .85;
  }
  #content .block b { color: var(--accent); font-weight: 700; }
  #content table.price {
    width: 100%;
    border-collapse: collapse;
    font-size: calc(var(--fs) * 0.72);
    margin-top: 6px;
  }
  #content table.price th, #content table.price td {
    border: 1px solid #34383f;
    padding: 9px 12px;
    text-align: left;
  }
  #content table.price th {
    background: var(--panel-2);
    color: var(--accent);
    font-weight: 700;
  }
  #content table.price td { color: var(--text); }
  #content table.price td.price-col { color: var(--accent); font-weight: 700; white-space: nowrap; }

  /* 阅读线 */
  #readingLine {
    position: absolute;
    left: 0; right: 0;
    top: 45%;
    height: 0;
    border-top: 2px dashed var(--line);
    pointer-events: none;
  }
  #readingLine::before {
    content: "";
    position: absolute;
    top: -28px; left: 0; right: 0; height: 56px;
    background: linear-gradient(to bottom, transparent, rgba(255,212,80,0.05), transparent);
  }

  /* 开始提示 */
  #hint {
    position: absolute;
    left: 50%; top: 45%;
    transform: translate(-50%, -50%);
    background: rgba(20,22,26,0.92);
    border: 1px solid #34383f;
    color: var(--accent);
    padding: 14px 26px;
    border-radius: 10px;
    font-size: 18px;
    letter-spacing: 2px;
    pointer-events: none;
    transition: opacity .4s;
  }
  #hint.hide { opacity: 0; }

  /* ---------- 底部控制栏 ---------- */
  #controls {
    height: 62px;
    flex: 0 0 62px;
    background: var(--panel);
    border-top: 1px solid #26292f;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 22px;
  }
  #controls .btn {
    background: var(--panel-2);
    border: 1px solid #34383f;
    color: var(--text);
    font-size: 15px;
    padding: 9px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    min-width: 74px;
    transition: background .15s;
  }
  #controls .btn:hover { background: #2a2e36; }
  #controls .btn.primary { background: var(--accent); color: #1a1400; font-weight: 700; border-color: var(--accent); }
  #controls .btn.primary:hover { background: #ffe27a; }
  #controls .group {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--dim);
    font-size: 13px;
    white-space: nowrap;
  }
  #controls input[type=range] {
    width: 170px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  #controls .chip {
    background: var(--panel-2);
    border: 1px solid #34383f;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 13px;
    color: var(--dim);
    min-width: 34px;
    text-align: center;
  }
  #currentSection {
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
  }
  #controls .spacer { flex: 1; }
  .kbd {
    display: inline-block;
    background: var(--panel-2);
    border: 1px solid #3a3f47;
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 11px;
    color: var(--dim);
    font-family: inherit;
  }

  /* ---------- 编辑模式 ---------- */
  #sidebar .edit-btn {
    background: var(--panel-2);
    color: var(--accent);
    border: 1px solid #34383f;
    font-weight: 700;
    text-align: center;
    margin-bottom: 12px;
  }
  #sidebar .edit-btn:hover { background: #2a2e36; }
  #editor {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 100;
    display: none;
    flex-direction: column;
  }
  #editor.open { display: flex; }
  #editor .ed-top {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid #26292f;
  }
  #editor .ed-title { font-size: 16px; font-weight: 700; color: var(--text); white-space: nowrap; }
  #editor .ed-hint { flex: 1; color: var(--dim); font-size: 12px; line-height: 1.6; }
  #editor .ed-btn {
    background: var(--panel-2);
    border: 1px solid #34383f;
    color: var(--text);
    font-size: 15px;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  #editor .ed-btn:hover { background: #2a2e36; }
  #editor .ed-btn.save { background: var(--accent); color: #1a1400; font-weight: 700; border-color: var(--accent); }
  #editor .ed-btn.save:hover { background: #ffe27a; }
  #editor .ed-btn.danger { color: #ff8a80; border-color: #5a2a26; }
  #editor textarea {
    flex: 1;
    background: #14161a;
    color: #e8eaed;
    border: none;
    outline: none;
    padding: 18px 24px;
    font-family: "Microsoft YaHei", Consolas, "Courier New", monospace;
    font-size: 16px;
    line-height: 1.75;
    resize: none;
    user-select: text;
    -webkit-user-select: text;
  }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="brand">公牛 · 提词器<small>开关插座抖音直播</small></div>
  <button id="editBtn" class="edit-btn">✏️ 编辑话术</button>
  <div id="sideButtons"></div>
</aside>

<div id="right">
  <div id="prompter">
    <div id="content"></div>
    <div id="readingLine"></div>
    <div id="hint">按 <span class="kbd">空格</span> 开始滚动</div>
  </div>
  <div id="controls">
    <button id="playBtn" class="btn primary">▶ 开始</button>
    <div class="group">
      <button id="speedMinus" class="btn">−</button>
      <input type="range" id="speedSlider" min="10" max="160" step="1" value="45">
      <button id="speedPlus" class="btn">+</button>
      <div class="chip" id="speedLabel">45</div>
    </div>
    <div class="group">
      <button id="fontMinus" class="btn">A−</button>
      <button id="fontPlus" class="btn">A+</button>
      <div class="chip" id="fontLabel">34</div>
    </div>
    <div class="spacer"></div>
    <div id="currentSection">—</div>
    <button id="fullBtn" class="btn">⛶ 全屏</button>
  </div>
</div>

<div id="editor">
  <div class="ed-top">
    <span class="ed-title">✏️ 编辑话术</span>
    <span class="ed-hint">格式：<b># 章节标题</b>（会变成左侧跳转按钮）｜<b>## 小标题</b>｜<b>- 要点</b>｜<b>&gt; 备注</b>｜<b>| 列1 | 列2 | 列3 |</b>（价格表格）｜普通行=正文｜<b>**加粗**</b></span>
    <button id="saveBtn" class="ed-btn save">💾 保存</button>
    <button id="resetBtn" class="ed-btn danger">↺ 恢复默认</button>
    <button id="cancelBtn" class="ed-btn">取消</button>
  </div>
  <textarea id="editArea" spellcheck="false" placeholder="在这里粘贴或编辑话术……"></textarea>
</div>

// 本地存储：用户编辑后的内容保存在这里，下次打开自动读取
const STORE_KEY = "bull_prompter_sections_v1";
function cloneSections(secs) {
  return secs.map(s => ({
    id: s.id,
    label: s.label,
    blocks: s.blocks.map(b => b.t === "price"
      ? { t: "price", d: b.d.map(row => row.slice()) }
      : { ...b }),
  }));
}
function loadSections() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!Array.isArray(data) || !data.length) return null;
    if (!data.every(s => s && typeof s.label === "string" && Array.isArray(s.blocks))) return null;
    return data;
  } catch (e) { return null; }
}
let SECTIONS = loadSections() || cloneSections(DEFAULT_SECTIONS);

// ================= 渲染 =================
const content = document.getElementById("content");
const sideButtons = document.getElementById("sideButtons");
const blockEls = [];   // 每个块的 DOM 元素
const blockSec = [];   // 每个块属于哪个 section 下标

function renderText(txt) {
  return txt.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
}

// ================= 编辑模式：话术文本 <-> 章节数据 =================
// 编辑框里用纯文本（Markdown 风格）表示内容，保存时解析回 SECTIONS。
function serializeSections(secs) {
  const parts = [];
  secs.forEach(sec => {
    parts.push("# " + sec.label, "");
    sec.blocks.forEach(b => {
      if (b.t === "h") parts.push("## " + b.d);
      else if (b.t === "note") parts.push("> " + b.d);
      else if (b.t === "bullet") parts.push("- " + b.d);
      else if (b.t === "price") b.d.forEach(row => parts.push("| " + row.join(" | ") + " |"));
      else parts.push(b.d);
      parts.push("");
    });
  });
  return parts.join("\n");
}

function parseText(text) {
  const sections = [];
  let cur = null;
  let tableRows = null;

  const pushBlock = (b) => {
    if (!cur) { cur = { label: "正文", blocks: [] }; sections.push(cur); }
    cur.blocks.push(b);
  };
  const flushTable = () => {
    if (tableRows && tableRows.length) {
      pushBlock({ t: "price", d: tableRows });
      tableRows = null;
    }
  };

  text.split(/\r?\n/).forEach(raw => {
    const line = raw.trim();
    if (!line) { flushTable(); return; }

    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      flushTable();
      const title = h[2].trim();
      if (h[1].length === 1) {
        cur = { label: title, blocks: [] };
        sections.push(cur);
      } else {
        pushBlock({ t: "h", d: title });
      }
      return;
    }
    if (line.startsWith(">")) { flushTable(); pushBlock({ t: "note", d: line.slice(1).trim() }); return; }
    if (line.startsWith("- ") || line.startsWith("* ")) { flushTable(); pushBlock({ t: "bullet", d: line.slice(2).trim() }); return; }
    if (line.startsWith("|")) {
      if (/^[\|\s\-:]+$/.test(line)) return; // 跳过 |---|---| 分隔行
      const cells = line.split("|").slice(1, -1).map(c => c.trim());
      if (!tableRows) tableRows = [];
      tableRows.push(cells);
      return;
    }
    flushTable();
    pushBlock({ t: "text", d: line });
  });
  flushTable();
  return sections;
}

function build() {
  let globalIdx = 0;
  SECTIONS.forEach((sec, si) => {
    sec.blocks.forEach(b => {
      let el;
      if (b.t === "h") {
        el = document.createElement("div");
        el.className = "block h";
        el.innerHTML = renderText(b.d);
      } else if (b.t === "note") {
        el = document.createElement("div");
        el.className = "block note";
        el.innerHTML = renderText(b.d);
      } else if (b.t === "bullet") {
        el = document.createElement("div");
        el.className = "block bullet";
        el.innerHTML = renderText(b.d);
      } else if (b.t === "price") {
        el = document.createElement("div");
        el.className = "block";
        const tbl = document.createElement("table");
        tbl.className = "price";
        b.d.forEach((row, ri) => {
          const tr = document.createElement("tr");
          row.forEach((cell, ci) => {
            const tag = ri === 0 ? "th" : (ci === 3 ? "td" : "td");
            const cellEl = document.createElement(tag);
            cellEl.textContent = cell;
            if (ri !== 0 && ci === 3) cellEl.className = "price-col";
            tr.appendChild(cellEl);
          });
          tbl.appendChild(tr);
        });
        el.appendChild(tbl);
      } else {
        el = document.createElement("div");
        el.className = "block text";
        el.innerHTML = renderText(b.d);
      }
      el.dataset.idx = globalIdx;
      content.appendChild(el);
      blockEls.push(el);
      blockSec.push(si);
      globalIdx++;
    });
  });

  // 侧边栏按钮
  SECTIONS.forEach((sec, si) => {
    const btn = document.createElement("button");
    const num = document.createElement("span");
    num.className = "num";
    num.textContent = String(si + 1).padStart(2, "0");
    btn.appendChild(num);
    btn.appendChild(document.createTextNode(" " + sec.label));
    btn.addEventListener("click", () => jumpToSection(si));
    btn.dataset.sec = si;
    sideButtons.appendChild(btn);
  });
}

// ================= 提词器核心 =================
const prompter = document.getElementById("prompter");
const readingLine = document.getElementById("readingLine");
const hint = document.getElementById("hint");
const READING_RATIO = 0.45;

let playing = false;
let speed = 45;
let lastTs = 0;
let rafId = null;
let currentIdx = 0;
// 高精度滚动位置（浮点）。浏览器会把 scrollTop 量化成 0.8px 的整数倍，
// 低速时每帧增量不足 0.8px，若从 DOM 读回累加会永远停在原地；
// 用独立浮点变量累加，亚像素进度不会丢失。
let pos = 0;

function maxScroll() {
  return Math.max(0, content.scrollHeight - prompter.clientHeight);
}
function clamp(v) {
  return Math.max(0, Math.min(maxScroll(), v));
}
function readingY() {
  return pos + prompter.clientHeight * READING_RATIO;
}
function setScroll(v) {
  pos = clamp(v);
  content.scrollTop = pos;
}

function activeBlockIndex() {
  const y = readingY();
  let best = 0, bestDist = Infinity;
  for (let i = 0; i < blockEls.length; i++) {
    const center = blockEls[i].offsetTop + blockEls[i].offsetHeight / 2;
    const dist = Math.abs(center - y);
    if (dist < bestDist) { bestDist = dist; best = i; }
  }
  return best;
}

function updateHighlight() {
  const idx = activeBlockIndex();
  if (idx === currentIdx) return;
  currentIdx = idx;
  blockEls.forEach((el, i) => el.classList.toggle("active", i === idx));
  const sec = blockSec[idx];
  document.querySelectorAll("#sideButtons button").forEach((b, i) => {
    b.classList.toggle("active", i === sec);
  });
  document.getElementById("currentSection").textContent = SECTIONS[sec].label;
}

function frame(ts) {
  if (!playing) { rafId = null; return; }
  if (!lastTs) lastTs = ts;
  const dt = (ts - lastTs) / 1000;
  lastTs = ts;
  setScroll(pos + speed * dt);
  updateHighlight();
  if (pos >= maxScroll()) {
    setPlaying(false);
    return;
  }
  rafId = requestAnimationFrame(frame);
}

function setPlaying(v) {
  playing = v;
  hint.classList.add("hide");
  const btn = document.getElementById("playBtn");
  btn.textContent = v ? "❚❚ 暂停" : "▶ 开始";
  if (v) {
    lastTs = 0;
    if (!rafId) rafId = requestAnimationFrame(frame);
  } else if (rafId) {
    cancelAnimationFrame(rafId);
    rafId = null;
  }
}

function togglePlay() {
  setPlaying(!playing);
}

function jumpToSection(si) {
  const firstBlock = blockEls.findIndex((el, i) => blockSec[i] === si);
  if (firstBlock < 0) return;
  // 让该章节起始块贴近视口顶部，阅读线自然落在该章正文上
  const target = blockEls[firstBlock].offsetTop - prompter.clientHeight * 0.12;
  setScroll(target);
  updateHighlight();
  setPlaying(true);
}

function jumpToBlock(blockIdx) {
  const target = blockEls[blockIdx].offsetTop - prompter.clientHeight * READING_RATIO;
  setScroll(target - prompter.clientHeight * 0.08);
  updateHighlight();
}

// 手动滚动：点击某一段 -> 居中到阅读线
content.addEventListener("click", (e) => {
  const b = e.target.closest(".block");
  if (b) jumpToBlock(parseInt(b.dataset.idx, 10));
});

// 鼠标滚轮手动翻
prompter.addEventListener("wheel", (e) => {
  e.preventDefault();
  setScroll(pos + e.deltaY);
  updateHighlight();
}, { passive: false });

// ================= 控制 =================
const speedSlider = document.getElementById("speedSlider");
const speedLabel = document.getElementById("speedLabel");
const fontLabel = document.getElementById("fontLabel");

function applySpeed() {
  speed = parseInt(speedSlider.value, 10);
  speedLabel.textContent = speed;
}
speedSlider.addEventListener("input", applySpeed);
document.getElementById("speedPlus").addEventListener("click", () => {
  speedSlider.value = Math.min(160, parseInt(speedSlider.value, 10) + 5);
  applySpeed();
});
document.getElementById("speedMinus").addEventListener("click", () => {
  speedSlider.value = Math.max(10, parseInt(speedSlider.value, 10) - 5);
  applySpeed();
});

let fontSize = 34;
function applyFont() {
  fontSize = Math.max(22, Math.min(64, fontSize));
  document.documentElement.style.setProperty("--fs", fontSize + "px");
  fontLabel.textContent = fontSize;
}
document.getElementById("fontPlus").addEventListener("click", () => { fontSize += 2; applyFont(); });
document.getElementById("fontMinus").addEventListener("click", () => { fontSize -= 2; applyFont(); });

document.getElementById("playBtn").addEventListener("click", togglePlay);

const fullBtn = document.getElementById("fullBtn");
function toggleFull() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
    fullBtn.textContent = "⤢ 退出全屏";
  } else {
    document.exitFullscreen();
    fullBtn.textContent = "⛶ 全屏";
  }
}
fullBtn.addEventListener("click", toggleFull);
document.addEventListener("fullscreenchange", () => {
  fullBtn.textContent = document.fullscreenElement ? "⤢ 退出全屏" : "⛶ 全屏";
});

// ================= 键盘 =================
document.addEventListener("keydown", (e) => {
  if (editor.classList.contains("open")) return; // 编辑模式下提词器快捷键全禁用
  if (e.target.tagName === "INPUT" && e.target.type === "range") {
    if (["ArrowUp", "ArrowDown"].includes(e.key)) return;
  }
  switch (e.key) {
    case " ": e.preventDefault(); togglePlay(); break;
    case "ArrowDown": e.preventDefault(); setScroll(pos + 60); updateHighlight(); break;
    case "ArrowUp":   e.preventDefault(); setScroll(pos - 60); updateHighlight(); break;
    case "PageDown":  e.preventDefault(); setScroll(pos + prompter.clientHeight * 0.7); updateHighlight(); break;
    case "PageUp":    e.preventDefault(); setScroll(pos - prompter.clientHeight * 0.7); updateHighlight(); break;
    case "+": case "=": speedSlider.value = Math.min(160, parseInt(speedSlider.value, 10) + 5); applySpeed(); break;
    case "-": case "_": speedSlider.value = Math.max(10, parseInt(speedSlider.value, 10) - 5); applySpeed(); break;
    case "]": fontSize += 2; applyFont(); break;
    case "[": fontSize -= 2; applyFont(); break;
    case "f": case "F": toggleFull(); break;
    case "Home": e.preventDefault(); setScroll(0); updateHighlight(); break;
    case "End":  e.preventDefault(); setScroll(maxScroll()); updateHighlight(); break;
  }
});

window.addEventListener("resize", () => {
  setScroll(pos);
  updateHighlight();
});

// ================= 编辑模式控制 =================
const editor = document.getElementById("editor");
const editArea = document.getElementById("editArea");

function openEditor() {
  editArea.value = serializeSections(SECTIONS);
  editor.classList.add("open");
  setPlaying(false); // 打开编辑时先暂停滚动
  editArea.focus();
}

function reloadContent() {
  content.innerHTML = "";
  blockEls.length = 0;
  blockSec.length = 0;
  sideButtons.innerHTML = "";
  currentIdx = -1;
  build();
  setScroll(0);
  setPlaying(false);
  updateHighlight();
  document.getElementById("currentSection").textContent = SECTIONS[0] ? SECTIONS[0].label : "—";
}

document.getElementById("editBtn").addEventListener("click", openEditor);
document.getElementById("cancelBtn").addEventListener("click", () => editor.classList.remove("open"));

document.getElementById("saveBtn").addEventListener("click", () => {
  const next = parseText(editArea.value);
  if (!next.length) { alert("没有识别到内容，请至少写一个 # 开头的章节标题。"); return; }
  SECTIONS = next;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(SECTIONS)); }
  catch (e) { alert("保存到本地失败：" + e); }
  reloadContent();
  editor.classList.remove("open");
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("恢复为内置原始话术？你编辑过的内容会被清除。")) return;
  localStorage.removeItem(STORE_KEY);
  SECTIONS = cloneSections(DEFAULT_SECTIONS);
  reloadContent();
  editor.classList.remove("open");
});

// 编辑框里 Ctrl+S / Ctrl+Enter 快速保存
editArea.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "Enter")) {
    e.preventDefault();
    document.getElementById("saveBtn").click();
  }
});

// ================= 启动 =================
build();
applySpeed();
applyFont();
updateHighlight();
</script>
